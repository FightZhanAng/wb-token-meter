<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Token 计量器</title>
    <script>
      /*
       * 胶囊主题的**兜底**。
       *
       * 正常路径是 preload 从启动参数里读出档位、在样式表之前写到 <html> 上
       * （见 preload/index.ts）—— 那一步比这里更早，所以首帧就是对的颜色。
       * 这段只在 preload 没跑成 / 参数丢了时兜一下：按系统深浅选一套，
       * 至少不会在深色桌面上先闪一块白。
       */
      if (!document.documentElement.dataset.capsule) {
        document.documentElement.dataset.capsuleTheme = 'auto'
        document.documentElement.dataset.capsule = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'ink'
          : 'paper'
      }
    </script>
  </head>
  <body>
    <!--
      静态兜底文案，React 挂载后替换掉。
      胶囊是不透明/透明的小窗，一旦渲染空白，
      屏幕上什么都看不到 —— 留着这行字才能区分「没渲染」和「没显示」。
    -->
    <div id="root">
      <div class="boot">计量中…</div>
    </div>
    <script type="module" src="./float.tsx"></script>
  </body>
</html>
