<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Token 计量器</title>
    <script>
      /*
       * 外观在样式表之前定下来。主进程已经把 nativeTheme.themeSource 设成了
       * 设置里那一档，所以这里读 prefers-color-scheme 就是最终答案 ——
       * 放到 React 里再设会先闪一帧浅色，深色下格外刺眼。
       */
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light'
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot">正在加载用量数据…<br /><span>如果这行字一直不变，说明前端脚本没能启动。</span></div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
