# pnpm 11 把构建脚本审批从 package.json 的 pnpm 字段挪到了这里。
# 两个包的构建脚本都不需要跑：esbuild 的平台二进制来自 optionalDependencies，
# electron-winstaller 只有打包 Squirrel 安装器时才用得到（本项目用 nsis）。
allowBuilds:
  electron-winstaller: false
  esbuild: false
  # electron 不在表里：43 起包内没有 install 脚本，二进制由 index.js 首次 require 时懒下载，
  # 所以既不用批准也拦不住，别把它加回允许列表。
