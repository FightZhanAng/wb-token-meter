appId: com.tomcato.wb-token-meter
productName: Token 计量器
copyright: Copyright © 2026 tomcato

directories:
  buildResources: resources
  output: release

# 更新源的声明。它只影响两处：
#   1. 打包时生成 resources/app-update.yml —— electron-updater 靠它知道去哪儿查版本
#   2. 生成 latest.yml（版本清单），CI 会连同安装包一起传上 Release
# 真正上传由 CI 的 gh release create 负责，dist 脚本固定带 --publish never。
publish:
  provider: github
  owner: FightZhanAng
  repo: wb-token-meter

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: assets
    filter:
      - '**/*'

win:
  # 用自己生成的多尺寸 .ico，别交给 electron-builder 转 ——
  # 它内置的 WASM 图标工具在内存受限环境下会直接崩掉打包流程
  icon: resources/icon.ico
  # 可执行文件名保持 ASCII：产品名带中文时，中文 exe 名在部分工具链和
  # 快捷方式解析上会出问题，显示名交给 productName 就够了
  executableName: wb-token-meter
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

# macOS。两个架构各出一份：Intel（x64）与 Apple 芯片（arm64）——
# 合并成 universal 会让体积翻倍，而这个应用本身很小，分开更好。
mac:
  # electron-builder 在 mac 上把这张 1024 的 png 转成 .icns；
  # 256 那张它会拒绝（icns 要求 512 起步）
  icon: resources/icon-1024.png
  category: public.app-category.utilities
  # dmg 给人装；zip 是 electron-updater 在 mac 上做差分的载体，少了它
  # 应用内的更新检查会报「更新源上找不到版本信息」
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # 带架构后缀 —— 两个架构同名会互相覆盖
  artifactName: wb-token-meter-${version}-${arch}.${ext}
  # 签名 / 公证靠 CI 的 CSC_LINK + CSC_KEY_PASSWORD + APPLE_ID 那套 secret 驱动；
  # 没配时 electron-builder 只警告、照样出包，但那样的 dmg 用户双击是
  # 「已损坏，无法打开」—— 所以配齐证书是发出去的前提，不是可选项

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Token 计量器
  artifactName: wb-token-meter-${version}-setup.${ext}

portable:
  artifactName: wb-token-meter-${version}-portable.${ext}
